name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  package:
    needs: [test, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Pack binary and frontend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="quay-${GOOS}-${GOARCH}"
          mkdir -p "out/${name}/web"
          go build -trimpath -ldflags "-s -w" -o "out/${name}/quay" ./cmd/server
          cp -a web/dist "out/${name}/web/dist"
          tar -C out -czf "${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: quay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: quay-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
